# ─── AcneAI ─────────────────────────────────────────────────
# เริ่มใช้งาน:  docker compose up --build   แล้วเปิด http://localhost:3000
# รันได้โดยไม่ต้องมีไฟล์ .env — ค่าเริ่มต้นทั้งหมดอยู่ในไฟล์นี้
# อยากเปลี่ยนค่า: สร้างไฟล์ .env ข้างไฟล์นี้ (ดูตัวอย่างใน .env.example)
# สำหรับพัฒนา (เปิด port เพิ่ม, hot reload): ดู docker-compose.dev.yml

# key ที่ web ใช้เรียก ai — ต้องเป็นค่าเดียวกันทั้งสองฝั่ง จึงประกาศไว้ที่เดียว
x-ai-key: &ai-key ${AI_SERVICE_API_KEY:-acne-local-docker-key}
# ความมั่นใจขั้นต่ำของกรอบสิว (0–1) — web กับ ai ใช้ค่าเดียวกันจากตรงนี้
x-ai-confidence: &ai-confidence ${AI_CONFIDENCE_THRESHOLD:-0.25}
# Test-Time Augmentation (true/false) — เจอสิวมากขึ้น แต่วิเคราะห์ช้าลง 2–3 เท่า
x-ai-tta: &ai-tta ${AI_USE_TTA:-false}

services:
  # ─── MongoDB (replica set — Prisma ต้องใช้) ────────────────
  mongodb:
    image: mongo:7
    container_name: acne_mongodb
    restart: unless-stopped
    # --quiet: ไม่พิมพ์ log ทุกครั้งที่มีการเชื่อมต่อ (healthcheck เชื่อมต่อเข้ามาเป็นระยะ)
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017", "--quiet"]
    ports:
      # เปิดให้เฉพาะเครื่องนี้เข้าได้ (เช่น MongoDB Compass) เครื่องอื่นในเครือข่ายเข้าไม่ได้
      # ต่อด้วย: mongodb://localhost:27018/acne_db?directConnection=true
      # ใช้ 27018 บนเครื่อง ไม่ให้ชนกับ MongoDB ที่อาจติดตั้งในเครื่อง (27017) — npm run dev ก็ต่อที่นี่ (database acne_dev)
      # ใน container ยังเป็น 27017 — เปลี่ยน port บนเครื่องได้ด้วย MONGO_PORT ในไฟล์ .env
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb   # ตั้งชื่อไว้ ไม่ให้ Docker สร้าง volume ชื่อสุ่ม
    healthcheck:
      # ตั้ง replica set ให้เองถ้ายังไม่เคยตั้ง แล้วรอจนเขียนข้อมูลได้
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }) } if (!db.hello().isWritablePrimary) { quit(1) }"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 5s
    networks:
      - acne_network

  # ─── FastAPI (AI Service) — ไม่เปิด port ออกนอก network ─────
  ai:
    build:
      context: ./apps/ai
      dockerfile: Dockerfile
    container_name: acne_ai
    restart: unless-stopped
    volumes:
      - image_files:/app/images              # รูปที่ผู้ใช้อัปโหลด (volume เดียวกับ web)
      - ./apps/ai/models:/app/models         # cache ไฟล์โมเดลที่โหลดมาจาก web
    environment:
      AI_SERVICE_API_KEY: *ai-key
      AI_CONFIDENCE_THRESHOLD: *ai-confidence
      AI_USE_TTA: *ai-tta
      STORAGE_PATH: /app/images
      MODELS_PATH: /app/models
      DEBUG: "false"
    networks:
      - acne_network

  # ─── Next.js (Web + Backend) ───────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: acne_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - image_files:/app/images              # รูปที่ผู้ใช้อัปโหลด (volume เดียวกับ ai)
      - model_files:/app/model-files         # ไฟล์โมเดล .pt (ไม่จำกัดขนาด)
    env_file:
      # ไม่บังคับ — มีไว้ใส่ค่าเสริม เช่น GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
      - path: ./apps/web/.env
        required: false
    environment:
      # ค่าในส่วนนี้ชนะค่าใน apps/web/.env เสมอ
      DATABASE_URL: mongodb://mongodb:27017/acne_db?replicaSet=rs0
      AUTH_SECRET: ${AUTH_SECRET:-acne-local-docker-secret-change-me}
      AUTH_TRUST_HOST: "true"
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_API_KEY: *ai-key
      AI_CONFIDENCE_THRESHOLD: *ai-confidence
      AI_USE_TTA: *ai-tta
      INTERNAL_APP_URL: http://web:3000     # ai ใช้ URL นี้โหลดไฟล์โมเดลจาก web
      STORAGE_PATH: /app/images
      # ที่เก็บไฟล์ของระบบนี้ (ดู dev-docs/environments.md) — ทุกอย่างอยู่ใน Docker volume ของเครื่องนี้
      IMAGE_STORAGE: local
      MODEL_STORAGE: file
      MODEL_STORAGE_PATH: /app/model-files
      APP_ENV: docker
      ENV_NAME: docker
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@acne.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin1234}
    depends_on:
      mongodb:
        condition: service_healthy
      ai:
        condition: service_started
    networks:
      - acne_network

volumes:
  mongodb_data:
  mongodb_config:
  model_files:
  image_files:

networks:
  acne_network:
    driver: bridge
