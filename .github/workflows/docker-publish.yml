# build image ของ web และ ai แล้ว push ขึ้น GitHub Container Registry (ghcr.io)
# ใช้กับ Azure Container Apps (ดู dev-docs/azure-deploy.md)
# - push เข้า main: build เฉพาะแอปที่โค้ดเปลี่ยน
# - กด Run workflow เอง (Actions → Docker images → Run workflow): build ทั้งสองแอป
# tag: latest และ sha-<commit> (ใช้ย้อนกลับรุ่นเก่าได้)
name: Docker images

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/ai/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write # ให้ azure/login ขอ token แบบ OIDC (ไม่ต้องเก็บรหัสผ่าน Azure ใน GitHub)

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
      ai: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ai == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - "apps/web/**"
              - ".github/workflows/docker-publish.yml"
            ai:
              - "apps/ai/**"
              - ".github/workflows/docker-publish.yml"

  build:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, ai]
    env:
      # ตั้งใน Settings → Secrets and variables → Actions (ดู dev-docs/azure-deploy.md → อัปเดตอัตโนมัติ)
      # ไม่ได้ตั้ง = build อย่างเดียว ไม่ deploy
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - name: ข้ามถ้าโค้ดของแอปนี้ไม่เปลี่ยน
        id: skip
        run: echo "skip=${{ needs.changes.outputs[matrix.app] != 'true' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.skip.outputs.skip != 'true'

      # ชื่อ image บน ghcr ต้องเป็นตัวพิมพ์เล็ก
      - name: ตั้งชื่อ image
        if: steps.skip.outputs.skip != 'true'
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/acne-${{ matrix.app }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
        if: steps.skip.outputs.skip != 'true'

      - uses: docker/login-action@v3
        if: steps.skip.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.skip.outputs.skip != 'true'
        with:
          context: apps/${{ matrix.app }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # อัปเดต Container App ให้ใช้ image ของ commit นี้ (tag sha-) — Azure ไม่ดึง latest ใหม่เอง
      - uses: azure/login@v2
        if: steps.skip.outputs.skip != 'true' && env.AZURE_CLIENT_ID != ''
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: deploy ขึ้น Azure Container Apps
        if: steps.skip.outputs.skip != 'true' && env.AZURE_CLIENT_ID != ''
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          : "${RG:?ยังไม่ได้ตั้ง Variable AZURE_RESOURCE_GROUP (Settings → Secrets and variables → Actions → แท็บ Variables)}"
          az containerapp update \
            --name acne-${{ matrix.app }} \
            --resource-group "$RG" \
            --image "${{ env.IMAGE }}:sha-${{ github.sha }}" \
            --query properties.template.containers[0].image -o tsv
